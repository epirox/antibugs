server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Proxy hacia la API Laravel (contenedor "backend", puerto 8000).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Propaga el trace_id si el cliente lo envía; si no, lo genera Laravel.
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }

    # Archivos adjuntos publicados con storage:link.
    location /storage/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Assets con hash: caché agresiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
