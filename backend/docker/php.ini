; Ajustes de PHP para el contenedor del backend
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 16M
expose_php = Off

; OPcache: código precompilado en memoria (imagen inmutable → no hay cambios en caliente)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
