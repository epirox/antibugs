apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # Permite saltar desde una línea de log al resto de logs con el mismo trace_id.
        - name: trace_id
          matcherRegex: '"trace_id":"([^"]+)"'
          url: '/explore?left={"datasource":"Loki","queries":[{"expr":"{service=\"backend\"} |= \"$${__value.raw}\""}]}'
