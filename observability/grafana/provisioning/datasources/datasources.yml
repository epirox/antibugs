apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        # Convierte el trace_id de cada línea en un enlace que muestra todos
        # los logs de esa misma petición (correlación Frontend → Backend → DB).
        - name: trace_id
          matcherRegex: '"trace_id":"([^"]+)"'
          url: '{service="backend"} |= "$${__value.raw}"'
          datasourceUid: loki
